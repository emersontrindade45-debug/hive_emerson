<title>Caderno de Gravação</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Caderno de Gravação — uma coluna de leitura, navegação em dois níveis (grupo → vídeo),
   cada vídeo em abas internas. Âmbar só onde guia o olho: tempo, corte, vídeo selecionado.
   09/10/2026 — aba Tópicos só no V08 e no V09. */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --surface-2:#F2F0EB;
  --ink:#1B1915; --muted:#67625A; --faint:#8F887D;
  --line:#E7E4DD; --line-strong:#D3CEC4;
  --accent:#A25807; --accent-soft:#FBF1E2; --accent-line:#EACFA6;
  --danger:#A82F26; --danger-soft:#FBEBE9;
  --warn:#80600A; --warn-soft:#FAF2DC;
  --pr-bg:#0C0C0B; --pr-fg:#F3F0E9; --pr-dim:#857F75; --pr-mark:#E9A13B; --pr-line:#242220;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141310; --surface:#1C1A17; --surface-2:#221F1B;
  --ink:#EDEAE3; --muted:#A39D92; --faint:#7E786E;
  --line:#2B2824; --line-strong:#3A3631;
  --accent:#E9A13B; --accent-soft:#2B2111; --accent-line:#54411F;
  --danger:#E8756A; --danger-soft:#331916;
  --warn:#DCB94A; --warn-soft:#2C2512;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141310; --surface:#1C1A17; --surface-2:#221F1B;
  --ink:#EDEAE3; --muted:#A39D92; --faint:#7E786E;
  --line:#2B2824; --line-strong:#3A3631;
  --accent:#E9A13B; --accent-soft:#2B2111; --accent-line:#54411F;
  --danger:#E8756A; --danger-soft:#331916;
  --warn:#DCB94A; --warn-soft:#2C2512;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.62;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
b{font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---- topo ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:800px;margin:0 auto;padding:10px 16px 0}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--faint);font-weight:500}
.stamp{font-size:12px;color:var(--faint);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.modes{display:flex;padding:2px;background:var(--surface-2);border-radius:999px;flex:none}
.mode{border:0;background:transparent;padding:5px 13px;font-size:13px;font-weight:600;color:var(--muted);border-radius:999px}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#pvsel{display:none;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 8px;max-width:46vw}

.groups{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.groups::-webkit-scrollbar,.vids::-webkit-scrollbar,.panes::-webkit-scrollbar{display:none}
.grp{border:0;background:transparent;padding:5px 11px 7px;font-size:13px;font-weight:600;color:var(--faint);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.grp .gn{font-weight:500;margin-left:5px;font-size:11.5px;opacity:.75}
.grp[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.vids{display:flex;gap:6px;overflow-x:auto;padding:9px 0 11px;scrollbar-width:none}
.tab{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--muted);flex:none}
.tab .tnum{font-family:var(--f-mono);font-size:11px;margin-right:6px;color:var(--faint)}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.tab[aria-selected="true"] .tnum{color:var(--accent)}
body.pmode .groups,body.pmode .vids,body.pmode .stamp{display:none}
body.pmode #pvsel{display:block}
body.pmode .top-in{padding-bottom:10px}

/* ---- documento ---- */
.wrap{max-width:800px;margin:0 auto;padding-inline:16px;padding-block:28px 88px}
.doc{max-width:720px}
.kicker{font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.02em}
.vtitle{font-size:clamp(25px,5.2vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.14;margin-top:6px}
.vsub{color:var(--muted);margin-top:10px;font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.meta span b{color:var(--faint);font-weight:500;margin-right:5px}
.chip{display:inline-block;margin:0 10px 4px 0;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink)}

/* abas internas do vídeo */
.panes{display:flex;gap:4px;margin-top:26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.pane-tab{border:0;background:transparent;padding:9px 12px;font-size:14px;font-weight:600;color:var(--faint);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.pane-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pbadge{font-family:var(--f-mono);font-size:11px;font-weight:500;margin-left:6px;color:var(--faint)}
.pbadge:empty{display:none}
.pane{padding-top:6px}

h2.sec{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:34px;color:var(--ink)}
h2.sec small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--faint);margin-left:8px}
.prose{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.65}
.prose b{color:var(--ink)}
.prose code,.ttext code,.why code{color:var(--ink)}

/* para quem */
.para-quem{margin-top:22px;background:var(--accent-soft);border-radius:12px;padding:18px 20px}
.pq-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.pq-pub{font-family:var(--f-display);font-weight:700;font-size:18px;margin-top:4px;line-height:1.3}
.pq-frase{margin-top:12px;font-size:17px;line-height:1.5;font-style:italic;color:var(--ink)}
.pq-extra{margin-top:12px;font-size:14px;color:var(--muted);line-height:1.65}
.pq-extra b{color:var(--ink)}

/* alerta de bloqueios */
.alerta{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-top:14px;padding:12px 16px;border:1px solid var(--danger);background:var(--danger-soft);border-radius:10px;text-align:left;color:var(--danger);font-size:14px}
.alerta span{font-weight:500;white-space:nowrap}

/* travas (novas: recolhíveis) */
.tvs{margin-top:12px;border-top:1px solid var(--line)}
.tv{border-bottom:1px solid var(--line)}
.tv summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:11px 2px}
.tv summary::-webkit-details-marker{display:none}
.tv summary::after{content:"+";margin-left:auto;color:var(--faint);font-weight:500;padding-left:12px}
.tv[open] summary::after{content:"–"}
.tv .tsev{flex:none}
.tv .ttitle{font-weight:600;font-size:14.5px;line-height:1.45}
.tv .ttext{padding:0 2px 14px;margin:0;font-size:14px;line-height:1.65;color:var(--muted)}
.tsev{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;padding:1px 7px;border-radius:999px;font-family:var(--f-body)}
.tv.r .tsev,.trava.r .tsev{background:var(--danger-soft);color:var(--danger)}
.tv.y .tsev,.trava.y .tsev{background:var(--warn-soft);color:var(--warn)}
/* travas das abas Guia (estrutura antiga) */
.travas{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.trava{display:grid;grid-template-columns:4px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tstripe{background:var(--line-strong)}
.trava.r .tstripe{background:var(--danger)} .trava.y .tstripe{background:var(--warn)}
.tbody{padding:11px 14px}
.thead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ttitle{font-weight:700;font-size:14.5px}
.ttext{margin-top:5px;font-size:13.5px;color:var(--muted)}
.ttext b{color:var(--ink);font-weight:600}

/* título e thumb */
.tits{margin-top:10px;border-top:1px solid var(--line)}
.tit{padding:11px 2px;border-bottom:1px solid var(--line)}
.tit b{display:block;font-weight:600;font-size:15px}
.tit span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}

/* roteiro: um bloco por vez, o texto falado em destaque */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}
.bloco{padding-block:22px;border-top:1px solid var(--line)}
.bloco:first-of-type{border-top:0}
.bhead{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
.btime{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
.bname{font-size:19px;font-weight:700;letter-spacing:-.01em}
.bfn{font-size:13.5px;color:var(--faint)}
.btag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.btag.take{background:var(--warn-soft);color:var(--warn)}
.fprompt{margin-top:12px;padding:16px 18px;background:var(--pr-bg);color:var(--pr-fg);border-radius:12px;font-size:16.5px;line-height:1.55}
.fprompt p{margin:0 0 9px} .fprompt p:last-child{margin-bottom:0}
.fprompt .mk{display:flex;align-items:center;gap:9px;margin:11px 0;color:var(--pr-mark);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.fprompt .mk::after{content:"";flex:1;height:1px;background:var(--pr-line)}
.fprompt .pslot{color:var(--pr-mark);background:rgba(233,161,59,.14);border-radius:3px;padding:0 4px}
.why{margin:14px 0 0;display:grid;gap:7px}
.why div{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:13.5px;line-height:1.6}
.why dt{color:var(--faint);font-size:12px;font-weight:600;padding-top:1px}
.why dd{margin:0;color:var(--muted)}
.why dd b{color:var(--ink)}
.why .pend{padding:9px 12px;background:var(--warn-soft);border-radius:8px;color:var(--ink);grid-column:1 / -1;display:block}
.why .pend b{color:var(--ink)}
.prod{margin-top:12px}
.prod summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--faint);list-style:none;display:inline-flex;align-items:center;gap:6px}
.prod summary::-webkit-details-marker{display:none}
.prod summary::before{content:"▸";font-size:10px;transition:transform .15s}
.prod[open] summary::before{transform:rotate(90deg)}
.prod summary:hover{color:var(--ink)}
.prod dl{margin:10px 0 0;padding:4px 14px;background:var(--surface-2);border-radius:10px;display:grid;grid-template-columns:120px 1fr}
.prod dt{font-size:12px;color:var(--faint);font-weight:600;padding:8px 0;border-top:1px solid var(--line)}
.prod dd{margin:0;padding:8px 0;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line)}
.prod dt:first-of-type,.prod dt:first-of-type+dd{border-top:0}
.prod dd b{color:var(--ink)}
.warnmark{color:var(--warn);font-weight:600}
.nota-bili{margin-top:8px;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:13.5px;color:var(--muted)}
.nota-bili b{color:var(--ink)}

/* cortes */
.corte{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.chead{padding:14px 16px 10px;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.cn{font-family:var(--f-display);font-weight:700;font-size:17px}
.cmeta{font-size:12.5px;color:var(--faint);flex-basis:100%}
.plats{display:flex;gap:4px;margin-left:auto}
.plat{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.ctable dl{margin:0;padding:0 16px;display:grid;grid-template-columns:96px 1fr}
.ctable dt{font-size:12px;color:var(--faint);font-weight:600;padding:9px 0;border-top:1px solid var(--line)}
.ctable dd{margin:0;padding:9px 0;font-size:14px;border-top:1px solid var(--line)}
.ctable dd em{font-style:normal;color:var(--ink);font-weight:500}
.cfoot{padding:12px 16px;background:var(--surface-2);font-size:13px;color:var(--muted);line-height:1.6}
.cfoot b{color:var(--ink)}

/* publicar: LinkedIn + plataformas */
.post{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px}
.pfirst{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.35}
.pbody{margin-top:10px;font-size:14.5px;color:var(--muted);white-space:pre-line;line-height:1.65}
.pbody b{color:var(--ink)}
.pask{margin-top:12px;font-size:14.5px;font-style:italic}
.ptags{margin-top:10px;font-size:12.5px;color:var(--accent)}
.scroller{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px;background:var(--surface)}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--faint);font-weight:600;background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td b{font-weight:600}
.gnote{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.65}
.gnote b{color:var(--ink)}

/* checklist */
.check{margin-top:12px;display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.ck:last-child{border-bottom:0}
.ck input{margin:3px 0 0;accent-color:var(--accent);width:17px;height:17px}
.ck.red span{font-weight:600}
.ck .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-right:8px;vertical-align:middle}
.ck:has(input:checked) span{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-strong)}
input[type=checkbox]{accent-color:var(--accent)}
.glist{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.glist li{padding:7px 2px;font-size:14px;line-height:1.6;color:var(--muted)}
.glist li b{color:var(--ink)}

.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);line-height:1.7}
.foot code{font-size:11.5px}


/* ---- aba Oratória ---- */
.osum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.os{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.os-acao{background:var(--accent-soft);border-color:var(--accent-line)}
.osk{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.os-acao .osk{color:var(--accent)}
.osv{margin-top:6px;font-size:14.5px;line-height:1.55;color:var(--ink)}
.osq{display:block;margin-top:6px;font-style:italic;color:var(--muted)}
.otom{margin:10px 0 0;border-top:1px solid var(--line)}
.otom>div{display:grid;grid-template-columns:200px 1fr;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.otom dt{font-weight:600;font-size:14.5px}
.otom dd{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.oacao{margin-top:12px}
.oa-main{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.4}
.oa-main span{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.oacao dl{margin:6px 0 0}
.oacao dl>div{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.oacao dt{font-weight:600;color:var(--faint);font-size:13px}
.oacao dd{margin:0;color:var(--muted)}
.olist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.oarco{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.oarco li{display:grid;grid-template-columns:96px 170px 1fr;gap:12px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.oat{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.oai{color:var(--muted);font-style:italic}
.omap{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.ob{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 16px}
.obn{font-family:var(--f-display);font-weight:700;font-size:15.5px}
.ob dl{margin:8px 0 0;display:grid;gap:4px}
.ob dl>div{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:13.5px;line-height:1.55}
.ob dt{color:var(--faint);font-size:12px;font-weight:600;padding-top:1px}
.ob dd{margin:0;color:var(--muted)}
@media (max-width:560px){
  .osum{grid-template-columns:1fr}
  .otom>div,.oacao dl>div{grid-template-columns:1fr;gap:2px}
  .oarco li{grid-template-columns:1fr;gap:2px}
}

/* ---- captação nos cortes ---- */
.cap{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--accent-soft)}
.cap-t{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.cap p{margin:6px 0 8px;font-size:14px;line-height:1.6;color:var(--ink)}
.spy{border-top:1px solid var(--line);padding:12px 16px;background:var(--surface)}
.spy-h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.spy-h span{display:block;margin-top:2px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:12.5px}
.spy dl{margin:8px 0 0;display:grid;gap:2px}
.spy dl>div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6}
.spy dl>div:first-child{border-top:0}
.spy dt{font-size:12px;font-weight:600;color:var(--faint);padding-top:1px}
.spy dd{margin:0;color:var(--muted)}
.spy dd b{color:var(--ink)}
@media (max-width:560px){.spy dl>div{grid-template-columns:1fr;gap:1px}}


/* ---- prompter, barra, overlay de câmera: sem mudança de comportamento ---- */
/* ---- prompter ---- */
.prompter{display:none}
body.pmode .doc{display:none}
body.pmode .prompter{display:block}
.prompter-in{background:var(--pr-bg);color:var(--pr-fg);border-radius:10px;padding:26px 20px 96px;min-height:70vh}
.ptxt{max-width:26ch;margin:0 auto;font-size:var(--psize,30px);line-height:1.42;font-weight:500;letter-spacing:-.005em}
.ptxt p{margin:0 0 .62em}
.pblock{margin:0 0 1.5em}
.pblock:first-child{margin-top:0}
.plabel{font-family:var(--f-mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--pr-dim);margin-bottom:.7em;display:flex;align-items:center;gap:9px}
.plabel::after{content:"";flex:1;height:1px;background:var(--pr-line)}
.pmark{display:flex;align-items:center;gap:10px;margin:.8em 0;padding:8px 11px;border:1px solid var(--pr-mark);border-radius:6px;color:var(--pr-mark);font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;line-height:1.35}
.pmark .bar{font-size:17px;line-height:1}
.ptake{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--pr-mark);border:1px dashed var(--pr-mark);border-radius:6px;padding:9px 12px;margin:0 0 1em;text-align:center}
.pslot{color:var(--pr-mark);background:rgba(233,161,59,.12);border-radius:3px;padding:0 4px}

.pbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--pr-bg);border-top:1px solid var(--pr-line);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none}
body.pmode .pbar{display:block}
.pbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pbtn{background:transparent;border:1px solid var(--pr-line);color:var(--pr-fg);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;font-family:var(--f-mono)}
.pbtn.go{background:var(--pr-mark);border-color:var(--pr-mark);color:#151006}
.pbar label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--pr-dim)}
.pbar input[type=range]{accent-color:var(--pr-mark);width:110px}
.pbtn.overlay-on{background:var(--pr-mark);border-color:var(--pr-mark);color:#151006}
.pbar-msg{position:fixed;left:16px;right:16px;bottom:64px;z-index:1002;max-width:1068px;margin:0 auto;background:var(--pr-mark);color:#151006;font-family:var(--f-mono);font-size:12px;line-height:1.4;padding:9px 13px;border-radius:6px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.pbar-msg.show{opacity:1}

/* overlay de câmera (celular e navegadores sem janela flutuante) */
#camOverlay{position:fixed;inset:0;z-index:1000;background:#000}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#camText{position:absolute;inset:0;overflow-y:auto;padding:18px 18px calc(124px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overscroll-behavior:contain;background:linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.18) 45%,rgba(0,0,0,.6));-webkit-user-select:none;user-select:none}
#camText .ptxt{max-width:none;margin:0;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.85)}
#camText .plabel{color:#e8e4dc}
#camText .plabel::after{background:rgba(255,255,255,.3)}
#camBar{position:fixed;left:0;right:0;bottom:0;z-index:1001;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;align-items:center;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,10,9,.72);backdrop-filter:blur(6px)}
#camBar select,#camBar button{font-family:var(--f-mono);font-size:13px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;padding:0;height:44px;min-width:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#camBar button.cgo{background:var(--pr-mark);border-color:var(--pr-mark);color:#151006}
/* linha 1: seletor de vídeo (2 colunas) + velocidade (4 colunas) */
#camBar #covid{grid-column:span 2;padding:0 6px;text-align:center}
#camBar .cospd-wrap{grid-column:span 4;display:flex;align-items:center;gap:8px;height:44px;padding:0 10px;border:1px solid rgba(255,255,255,.2);border-radius:8px}
#camBar .cospd-wrap label{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65)}
#camBar input[type=range]{flex:1;min-width:0;width:auto;accent-color:var(--pr-mark);height:28px}
/* linha 2: os seis botões, um por coluna */
#camBar #corec{grid-column:span 2;font-size:12px}
/* sem câmera: fundo sólido, senão o texto branco fica sobre o preto puro sem contraste de leitura */
#camOverlay.sem-camera #camText{background:#0C0C0B}
#camOverlay.sem-camera #camText .ptxt{text-shadow:none}
#camRecBadge{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:1001;background:var(--danger);color:#fff;font-family:var(--f-mono);font-size:12px;padding:5px 10px;border-radius:20px;display:flex;gap:6px;align-items:center}
#camRecBadge::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:camblink 1s step-start infinite}
@keyframes camblink{50%{opacity:.15}}


@media (max-width:560px){
  .top-in{padding-top:8px}
  .stamp{display:none}
  .brand{font-size:16px}
  .brand span{display:none}
  .mode{padding:5px 11px}
  body.pmode .brand{display:none}
  body.pmode #pvsel{flex:1;max-width:none;min-width:0}
  .why div{grid-template-columns:1fr;gap:1px}
  .prod dl,.ctable dl{grid-template-columns:1fr}
  .prod dt,.ctable dt{padding:8px 0 0;border-top:1px solid var(--line)}
  .prod dd,.ctable dd{padding:1px 0 8px;border-top:0}
  .prod dt:first-of-type,.ctable dt:first-of-type{border-top:0}
  .para-quem{padding:16px}
  .fprompt{padding:14px 15px;font-size:16px}
  .pbar-in{gap:7px}
  .pbtn{padding:9px 13px;font-size:13px;touch-action:manipulation}
  .pbar input[type=range]{flex:1;min-width:90px;height:28px}
  #overlayBtn{flex-basis:100%;text-align:center}
  .ptxt{max-width:none}
  .prompter-in{padding:20px 16px 110px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.prod summary::before{transition:none}}

/* ---- abas Guia e Grade (mesmos componentes de antes) ---- */
/* guia de plataformas — usa os mesmos tokens do caderno */
.g-lede{margin-top:12px;font-size:15px;line-height:1.55;border-left:3px solid var(--accent);padding-left:13px}
.g-lede b{font-weight:700}
.g-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.src{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;white-space:nowrap;vertical-align:1px}

 extra:"<b>Secundário:</b> P4 autônomo, que presta conta de atividade para cliente. <b>Intenção:</b> informar, com o experimento como bastidor. <b>Vocabulário:</b> anotação, caderno, relatório da semana, chefe, pendente, aguardando, conferir, colega. <b>Não usar:</b> agente, pipeline, workflow, rastreabilidade (a ideia entra; a palavra vira “dizer de onde saiu”).<br><br><b>A ideia em uma frase:</b> não dá pra fazer a IA nunca errar — mas dá pra fazer o erro aparecer.",
 origem:"<b>Por que a v3.</b> A v2 dependia de notas fiscais de reembolso, e o Emerson não tem essas notas. O que ele tem é melhor: <b>meses de anotações diárias do próprio trabalho</b>, com os status escritos à mão (“aguardando”, “em andamento”, “avisado”, “fulano vai fazer”). São exatamente as armadilhas em que uma IA escorrega quando resume uma semana.<br><br><b>A semana-espelho:</b> a estrutura de uma semana real, com <b>todo nome trocado por fictício</b> e todo processo virando “Pedido 1xx”. Continuam reais: a quantidade de itens, a ordem, o dia sem anotação e os status. Decisão do Emerson em 25/09: <i>“use nomes fictícios, para ficar mais real”</i>.",

  {s:"r",t:"Sigilo do trabalho",x:"<b>Nada do trabalho real aparece</b> — nem local, setor, função, número de processo, nome de colega ou registro. As anotações originais <b>nunca</b> vão à tela (nem borradas) e <b>nunca</b> são coladas em nenhuma IA. Na tela, só a semana-espelho."},

 posts:[
  {f:"A IA não mente por maldade. Ela completa por obrigação. E essa diferença muda como você pede.",
   b:"Colei as anotações de uma semana de trabalho no ChatGPT (nomes trocados) e pedi o relatório. Voltou bonito: resumo, entregas, pendências, até “principais resultados”.\n\n[O ERRO REAL, EM UMA FRASE]\n\nEla não achou aquilo na anotação. Ela completou, porque relatório tem “concluído” e a anotação não dizia.\n\nO perigoso não é o erro. É que não parece errado.\n\nA correção: <b>“se não tiver o dado, escreva NÃO INFORMADO — não estime.”</b> Uma frase no pedido.",

 nota:"<b>A semana-espelho</b> — o que aparece na tela e vai para o ChatGPT (nomes fictícios; a terça fica sem anotação de propósito, como na semana original):<span style=\"display:block;white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0 14px;color:var(--ink)\">SEGUNDA\n- Conferência mensal de valores — comecei, continua amanhã\n- Pedido 101 — pagamento da Carla Menezes — lançado\n- Pedido 102 — pagamento do Otávio Ramos — lançado\n- Pedido 103 — informação de valores pro Heitor Campos — respondido\n- Pedido 104 — requerimento da Beatriz Lacerda — respondido e assinado\n- LEMBRAR: cadastro do Mateus (colega novo) na quarta — avisado\n- RECADO: a Irene, da diretoria, está com dúvida no pedido 087 — avisado\n\nQUARTA\n- Pedido 105 — pagamento da Sônia Duarte — lançado\n- Pedido 106 — pagamento de plantão, 5 pessoas, Vinícius Prado excluído da lista — lançado\n- Conferência mensal — EM ANDAMENTO\n\nQUINTA\n- Avisar o Raul pra ir no outro setor falar com a Lorena\n- Pedido 107 — Yasmin Torres — verificar com o Raul, ELE VAI FAZER\n- Pedido 108 — Caio Nogueira — lançado. Regra: mantém o valor, desconta vale-transporte\n- Pedido 109 — desligamento do estagiário Diego Albuquerque — aguardando documento\n\nSEXTA\n- Pedido 110 — pagamento da Helena Castro — lançado</span><b>Gabarito:</b> concluídos <b>8</b> (101 · 102 · 103 · 104 · 105 · 106 · 108 · 110) · em andamento <b>1</b> (conferência mensal) · aguardando outra pessoa <b>1</b> (109) · não é seu <b>1</b> (107, o Raul vai fazer) · recados que não são entrega <b>3</b> · terça sem anotação · <b>nenhum</b> número de resultado nas anotações.<br><br><b>As 7 armadilhas:</b> (1) conferência “em andamento” dada como concluída · (2) o 107 na sua lista · (3) o 109 dado como feito · (4) recado “avisado” virando problema resolvido · (5) terça inventada · (6) resultado, porcentagem ou impacto inventado · (7) total de pedidos errado.<br><br><b>Prompt A (pedido ruim):</b> <code>monta meu relatório semanal</code> + a semana colada.<br><b>Prompt B (corrigido):</b> seções concluído · em andamento · aguardando outra pessoa · recados — regras: só o que está nas anotações · só é concluído o que está escrito como lançado, respondido ou assinado · tarefa de outra pessoa não é minha · sem resultado inventado, NÃO INFORMADO · origem de cada linha · não contar o total.<br><b>Prompt C (revisora):</b> comparar cada linha com as anotações e listar só o que foi dado como concluído sem estar escrito, o que não é meu e o que não tem origem — sem reescrever.<br><br>Roteiro completo, com os prompts literais e os 8 passos do teste: <code>squads/marketing/data/roteiros/video-04-v3-relatorio-semana-espelho.md</code>."

  {h:"Descrição e publicação",html:`
  <p style="font-size:13.5px;color:var(--muted);margin-top:12px;white-space:pre-line">Faz 45 dias que eu uso o ChatGPT no meu trabalho, sem método. Pedi pra ele me explicar, passo a passo, o que aprendeu comigo — e a resposta mostra o que mudou de verdade: não foi ele. Neste vídeo você vê a resposta inteira na tela, as etapas que dá pra copiar e a estimativa dele de quanto tempo isso leva por semana.

00:00 O que eu pedi pro ChatGPT
00:45 O pedido na tela
01:05 As primeiras 3 etapas
04:30 Da etapa 4 à 10
09:30 O que ficou mais inteligente
12:00 O passo a passo pra você
13:40 Quanto tempo leva em cada semana
15:15 As 3 coisas pra começar segunda-feira

O vídeo do relatório que eu cito no final: [link V04]</p>
  <p style="font-size:13px;color:var(--muted);margin-top:10px">⚠️ Capítulos aproximados — acertar depois da montagem. <b>Publicação: qui 01/10, 17h30</b>, dois dias depois do V04 (<code>playbook — onda de momento</code>).</p>`}],

  {t:"~9:30",n:"P2 · O que ficou mais inteligente",f:"ponte de câmera · o ponto alto",
   p:["▌","Agora vem a parte mais importante da resposta.","Ela mesma pergunta: o que realmente ficou mais inteligente nesse processo?","E responde assim:","o modelo não foi retreinado pelas nossas conversas.","Os parâmetros internos dele não foram modificados.","O que ficou mais sofisticado foi o jeito de usar a ferramenta.","","E tem um exemplo ali que é exatamente o que eu vivo.","Uma tarefa que antes precisava de um comando enorme,","hoje eu peço de forma direta.","Eu praticamente só confiro e aponto.","","Ou seja: não foi a IA que aprendeu o meu trabalho.","Fui eu que aprendi a explicar o meu trabalho pra ela."],

  {t:"~15:15",n:"D1 · As 3 coisas do guia",f:"fechar com ação",
   p:["▌","Do guia inteiro, se você fizer só três coisas, já muda a sua semana.","Um: apresenta a sua rotina pra ela. As tarefas de verdade. Sem dado sigiloso, sem nome de ninguém.","Dois: quando ela errar, corrige, e pede pra ela usar essa correção das próximas vezes.","Três: confere. Quem responde pelo que vai pro seu chefe é você, não ela.","Faz isso por uma semana e compara."],

  {t:"~15:50",n:"D2 · O problema novo + CTA",f:"o motivo concreto pra voltar",

  {t:"2:30–5:30",n:"Bloco 2",f:"a conta por token",
   p:["Aqui eu preciso usar uma palavra feia, e eu vou traduzir ela uma vez só.","Token.","Token é pedaço de texto.","Tudo que a IA lê e tudo que ela escreve vira pedaço de texto, e é isso que a Meta conta pra cobrar.","Não é por cliente. Não é por mês. Não é por plano.","É por texto que passou.","","O preço tá escrito na documentação dela.","Dois dólares por um milhão de pedaços de texto.","","Um milhão parece muito. E aí você pensa: nunca vou chegar lá.","Só que uma mensagem sozinha come uns vinte, vinte e cinco mil desses pedaços.","Porque não é só o que o cliente escreveu.","É o que a IA leu do seu catálogo, o que ela leu da conversa inteira até ali, e o que ela escreveu de volta.","▌","Então, na prática — e esse número é da própria Meta.","Uma mensagem sai por uns quatro, cinco centavos de dólar.","Uma conversa simples, aquela de tem tal produto, quanto é, tá aberto até que horas — dezesseis a vinte centavos.","Uma conversa complicada, com o cliente mudando de ideia, perguntando de três produtos, voltando atrás — quarenta a cinquenta centavos.","","E antes que alguém pergunte: eu não testei essa ferramenta.","Eu li a documentação e comparei com o que eu vejo acontecer num comércio de verdade.","Eu conferi isso em [DATA DA CONFERÊNCIA].","Se você tá vendo esse vídeo daqui seis meses, confere de novo. Preço de IA muda."],

 posts:[
  {f:"A cobrança por mensagem do WhatsApp acabou em maio. E ela nunca foi para o dono de comércio.",
   b:"Tem vídeo circulando perguntando se a Meta vai cobrar por mensagem no WhatsApp. A pergunta ficou no ar e virou conta errada.\n\nOs fatos, da documentação da Meta:\n\n• Cobrança por mensagem: existiu no Brasil de 11/03 a 13/05/2026, para contas classificadas como “AI Providers” — aplicativos de IA de terceiros. <b>Encerrada.</b>\n• Cobrança por token: vigente desde 01/08/2026, US$ 2,00 por milhão de tokens. <b>Essa sim vale para o Business Agent.</b>\n\nNa prática: uma conversa simples custa de US$ 0,16 a US$ 0,20.\n\nJuntar as duas faz a conta ficar dez vezes maior do que é — e faz gente desistir de algo que talvez fizesse sentido.",

   b:"1. Quanto custa a IA do WhatsApp por mês?\n2. A Meta cobra por token. US$ 2,00 por 1 milhão.\n3. 1 mensagem ≈ 20 a 25 mil tokens ≈ US$ 0,04\n4. 1 conversa simples ≈ US$ 0,18 · complexa ≈ US$ 0,45\n5. <b>10 conversas/dia = 300/mês = US$ 54 a US$ 135</b>\n6. Agora compare com a hora de quem responde hoje.",

 origem:"A origem mais barata que existe: o próprio canal. <code>dado do canal</code> — Studio → Alcance → <i>Termos de pesquisa</i> do Short <code>3XxdW_Rvvyo</code> (77 views, <b>84,4% do tráfego vindo de busca</b>): “códigos do chatgpt” 1,6% · “galera chat gpt” 1,6% · “gemini ou chatgpt” 1,6%.<br><br>⚠️ <b>O que esses termos provam:</b> 69,8% pulou aquele Short. São matéria-prima de pauta e diagnóstico de desalinhamento, <b>não validação de demanda</b>. Por isso prioridade média.",

  {s:"r",t:"A fórmula testada ao vivo tem que ser real",x:"Escolher uma fórmula pronta que <b>circula de verdade</b> e testar na tela. <b>Não montar fórmula de palha.</b> Se a escolhida funcionar bem, dizer isso em voz alta e trocar."},

  {t:"0:08–0:20",n:"O que tem no conteúdo",f:"a agenda",

  {t:"0:30–2:30",n:"Bloco 1",f:"por que você procura código secreto (e faz sentido)",
   p:["Antes de dizer que não existe, eu quero dizer por que faz todo sentido você procurar.","","Você viu alguém postar um texto grande.","Cheio de você é um especialista em tal coisa, com vinte anos de experiência.","E o resultado ficou impressionante.","Aí você copiou, colou, e no seu caso veio mais ou menos.","","Se funcionou pra um e não pra você, a conclusão óbvia é que falta um pedaço do segredo.","É lógico.","É por isso que código do ChatGPT é uma busca de verdade.","","Só que a conclusão óbvia tá errada.","E eu vou te mostrar por quê, com uma dessas na tela."],

  {t:"2:30–6:00",n:"Bloco 2",f:"a fórmula pronta, ao vivo",
   p:["Peguei essa aqui.","Olha o tamanho.","Isso é o que vende: parece que quanto maior, melhor.","","Vou colar e pedir.","","E olha o resultado. Não tá ruim.","","Mas agora olha uma coisa.","O que nessa resposta serve pro meu trabalho de verdade?","","Quase nada.","▌","Porque essa fórmula carrega o contexto de quem escreveu ela.","O cara que montou isso tinha uma empresa, um cliente, um problema.","Ele descreveu o mundo dele dentro do texto.","Quando você cola, você tá pedindo a resposta pro problema dele, com o seu nome em cima.","","Não é que falta um pedaço do segredo.","É que sobra o contexto de outra pessoa."],

   pe:"<b>logos + patos</b> — demonstração na tela, e a inversão final é a frase que o espectador leva",
   cx:"Pergunta plantada no meio — “o que nessa resposta serve pro meu trabalho de verdade?”, <b>pausa de 3s</b>",
   c:C("captura própria — a fórmula colada, a resposta rolando, zoom nos trechos que não servem","tela cheia → ⚠️ <b>rosto centralizado e parado no trecho ▌</b>","fala limpa · <b>pausa de 3s</b> após “Quase nada”","nenhum","nenhum — ⚠️ nome e @ desfocados","queimada no vertical do trecho ▌","nenhum","<b>sim — Corte 1, o mais forte do vídeo</b>"),corte:1},
  {t:"6:00–9:30",n:"Bloco 3",f:"as quatro partes de um pedido que funciona",
   p:["Então o que entra no lugar.","Quatro coisas. E nenhuma delas é uma palavra mágica.","","Um: o que é isso.","Não escreve um e-mail.","Escreve o e-mail que eu mando pro cliente quando o pedido atrasa.","A mesma tarefa, com o mundo em volta.","","Dois: pra quem.","O mesmo e-mail pro cliente de dez anos e pro cliente novo não é o mesmo e-mail.","Se você não disser, ela escolhe sozinha. E ela escolhe o genérico.","▌","Três: o que não pode.","Essa é a que quase ninguém escreve, e é a que mais muda.","Não promete data. Não pede desculpa três vezes.","Limite é informação.","","Quatro: um exemplo do que você considera bom.","Um e-mail seu, antigo, que deu certo.","Isso sozinho vale mais que a fórmula inteira do outro cara.","Porque você acabou de dar pra ela o seu contexto. Que é o que faltava.","","Repara numa coisa: nada disso é truque.","É só descrever o que você quer.","E é por isso que ninguém vende — não dá pra empacotar o seu contexto num PDF."],

  {t:"9:30–11:00",n:"Bloco 4",f:"o mesmo pedido, lado a lado",
   p:["Agora o mesmo pedido do começo, reescrito com as quatro partes.","▌","Olha o tamanho: é menor que a fórmula. Bem menor.","","E olha a resposta.","","Mesma ferramenta. Mesmo dia. Mesmo minuto.","O que mudou não foi a IA.","Foi eu ter dito o que eu queria."],

 posts:[

saída.”</td><td>“…lá no final do vídeo.”</td></tr><tr><td><b>2</b> · bloco 9, e-book</td><td>8:31 → 8:50 (19 s)</td><td>“Por isso eu montei um e-book com as folhas prontas…”</td><td>“…te digo onde você tem que pegar lá no final do vídeo.”</td></tr><tr><td><b>3</b> · T-CTA, convite inteiro</td><td>9:24 → 10:01 (38 s)</td><td>“O e-book A Conta do WhatsApp com IA está no link aqui da descrição…”</td><td>“…a sua necessidade.” (fica a tela final: “No vídeo anterior…”)</td></tr></tbody></table></div><p class='gnote'><b>Fica:</b> o like (bloco 5) e a inscrição (bloco 11) — não nomeiam o YouTube. Depois de apagar o 2, confira a emenda: o bloco 9 fecha em “…se vale a pena você utilizar ela ou não.” e entra direto na confissão. Versão final ≈ <b>9:09</b>.</p>"}, {"h": "⏳ Pendente — tela de preços da Meta (bloco 4)", "html": "<p class='gnote'>⏳ <b>Ainda não gravada (04/10).</b> Fica fora do projeto V07-montagem-01 até existir.</p><div class='scroller'><table><tbody><tr><td><b>O que é</b></td><td>Uma gravação curta da página oficial de preços do WhatsApp, a fonte de onde saíram o “1.000 grátis” e o “R$ 0,035”: <code>developers.facebook.com/docs/whatsapp/pricing</code></td></tr><tr><td><b>Para que serve</b></td><td>É a prova. Quando você diz “mil respostas grátis por mês”, o espectador vê o texto da própria Meta, e não só um cartão seu. Isso dá credibilidade ao bloco 4</td></tr><tr><td><b>O que gravar</b></td><td>Abrir a página e rolar devagar até o trecho que fala do nível gratuito de 1.000 mensagens de serviço. Se der, parar também na tabela em reais (serviço R$ 0,035). São 10–15 s, sem som</td></tr><tr><td><b>Como gravar</b></td><td>Do mesmo jeito que você gravou as telas do V06 (Google Vids), ou com Win+Alt+R no Windows</td></tr><tr><td><b>Onde entra</b></td><td>Bloco 4, por cima da fala “cada número agora tem mil respostas gratuitas por mês… da milésima primeira, 3,5 centavos”. O selo fica por cima</td></tr></tbody></table></div><p class='gnote'>A página está em inglês. Grave assim mesmo, porque é a citação original, e a legenda/cartão em português já explica. Se a gravação não sair, o vídeo funciona sem ela: o selo e os cartões <code>linha-do-tempo</code> e <code>sem-cartao</code> cobrem o mesmo trecho, só com menos força de prova.</p>"}, {"h": "Respostas prontas para os comentários (“conversas por dia”)", "html": "<p class='gnote'>Ache a linha mais próxima do número que a pessoa comentou e cole a resposta. Premissas: 5 respostas da IA por conversa · 30 dias · IA mais barata · regra da Meta de 01/10/2026. Se o número for muito diferente, responda com o mais próximo e diga “mais ou menos”.</p><div class='scroller'><table><thead><tr><th>Conversas/dia</th><th>Respostas/mês</th><th>Meta</th><th>Mês (IA barata)</th><th>Resposta para colar</th></tr></thead><tbody><tr><td><b>5</b></td><td>750</td><td>R$ 0</td><td>R$ 47–R$ 116</td><td>Com 5 conversas por dia, dá umas 750 respostas no mês. Você fica dentro das 1.000 respostas grátis da Meta (regra de 01/10). Somando computador e IA, fica entre R$ 47 e R$ 116 por mês na IA mais barata. A conta completa, com o seu lucro, tá no e-book grátis do link da descrição 👊</td></tr><tr><td><b>10</b></td><td>1.500</td><td>R$ 18</td><td>R$ 67–R$ 141</td><td>Com 10 conversas por dia, dá umas 1.500 respostas no mês. As 1.000 grátis da Meta acabam por volta do dia 20, e o resto sai uns R$ 18 de Meta, pela regra de 01/10. Somando computador e IA, fica entre R$ 67 e R$ 141 por mês na IA mais barata. A conta completa, com o seu lucro, tá no e-book grátis do link da descrição 👊</td></tr><tr><td><b>20</b></td><td>3.000</td><td>R$ 70</td><td>R$ 124–R$ 208</td><td>Com 20 conversas por dia, dá umas 3.000 respostas no mês. As 1.000 grátis da Meta acabam por volta do dia 10, e o resto sai uns R$ 70 de Meta, pela regra de 01/10. Somando computador e IA, fica entre R$ 124 e R$ 208 por mês na IA mais barata. A conta completa, com o seu lucro, tá no e-book grátis do link da descrição 👊</td></tr><tr><td><b>30</b></td><td>4.500</td><td>R$ 123</td><td>R$ 182–R$ 275</td><td>Com 30 conversas por dia, dá umas 4.500 respostas no mês. As 1.000 grátis da Meta acabam por volta do dia 7, e o resto sai uns R$ 123 de Meta, pela regra de 01/10. Somando computador e IA, fica entre R$ 182 e R$ 275 por mês na IA mais barata. A conta completa, com o seu lucro, tá no e-book grátis do link da descrição 👊</td></tr><tr><td><b>50</b></td><td>7.500</td><td>R$ 228</td><td>R$ 297–R$ 409</td><td>Com 50 conversas por dia, dá umas 7.500 respostas no mês. As 1.000 grátis da Meta acabam por volta do dia 4, e o resto sai uns R$ 228 de Meta, pela regra de 01/10. Somando computador e IA, fica entre R$ 297 e R$ 409 por mês na IA mais barata. A conta completa, com o seu lucro, tá no e-book grátis do link da descrição 👊</td></tr><tr><td><b>100</b></td><td>15.000</td><td>R$ 490</td><td>R$ 585–R$ 744</td><td>Com 100 conversas por dia, dá umas 15.000 respostas no mês. As 1.000 grátis da Meta acabam por volta do dia 2, e o resto sai uns R$ 490 de Meta, pela regra de 01/10. Somando computador e IA, fica entre R$ 585 e R$ 744 por mês na IA mais barata. A conta completa, com o seu lucro, tá no e-book grátis do link da descrição 👊</td></tr></tbody></table></div>"}]});

<ul class="glist">
  <li><span class="src m">Aula 07</span> <b>Comunidade = causa + pertencimento + relacionamento</b>, com gente que conversa entre si. <b>Grupo de WhatsApp e lista de transmissão não são comunidade</b> por si só. Reforça usar o WhatsApp como conversa.</li>
  <li><span class="src m">Aula 07</span> <b>7 elementos:</b> causa · inimigo comum (um fenômeno, nunca uma pessoa) · antídoto · líder · linguagem própria · rituais · símbolos. O canal já tem rituais e linguagem: o “Fui!”, a ponte do Short, a enquete na véspera.</li>
  <li><span class="src m">Aula 07</span> <b>O erro que mata:</b> transformar toda interação em tentativa de venda. É a base da trava “servir primeiro”.</li>
  <li><span class="src m">Aula 08</span> <b>Movimento:</b> agenda ativa · microcomunidades · crença · rituais · código de conduta · ponto de encontro · missões · <b>fato novo</b> (“fato novo = dinheiro novo”: datas, marcos, desafios) · líder que é o mensageiro, não a mensagem.</li>
  <li><span class="src m">Aula 08</span> <b>Servir 10 para 1:</b> para tirar 10 de valor, deposite 100. Ele contribuiu 4 anos na rede antes da primeira venda (9 e-books a R$ 9,99).</li>
</ul>

<h2 class="sec">7 · Regras do método que valem para todas</h2>
<ul class="glist">
  <li><span class="src m">Aula 05</span> <b>Distribuição:</b> “não precisa estar em todo lugar, precisa estar onde o cliente está, com a <b>linguagem nativa</b> do canal.”</li>
  <li><span class="src m">Aula 05</span> <b>Frequência:</b> “confiança vem de frequência de contato, não de picos. <b>Consistência &gt; intensidade.</b>”</li>
  <li><span class="src m">Aula 07</span> <b>Um quadrado pequeno primeiro.</b> O Joel só cresceu quando parou de falar do que todo mundo falava e ficou em “alta performance”. Esse quadrado deu credibilidade para abrir outros depois. Vale para o eixo “IA aplicada a trabalho que já existe”.</li>
  <li><span class="src m">Aula 07</span> <b>O quadrado aparece pela reação do público</b>, quando você está imerso, não pensando sobre ele. É o que o dado do vidIQ e do TikTok vai mostrar.</li>
  <li><span class="src m">Aula 04</span> <b>Teste primeiro, distribua depois.</b> Hoje o teste é a grade do TikTok.</li>
  <li><span class="src m">Aula 02</span> <b>Toda peça termina com CTA</b>: comenta, compartilha, chama na conversa.</li>
</ul>
<p class="gnote">⚠️ <b>O que o método ainda não fala:</b> Shorts, Comunidade, Bilibili e <b>nenhuma quantidade de posts</b>. A Aula 08 cita a linguagem nativa de LinkedIn, TikTok, YouTube e Spotify, mas sem número. Toda quantidade desta aba é dado de mercado ou decisão sua.</p>

<h2 class="sec">8 · O que o mercado mostra</h2>
<div class="travas">
  <div class="trava y"><div class="tstripe"></div><div class="tbody"><div class="thead"><span class="tsev">TikTok</span><span class="ttitle">Mais posts = mais chances de viralizar, não post típico melhor</span></div>
  <div class="ttext">Buffer, 11,4 mi de posts (out/2025): 2–5/sem = <b>+17% de views por post</b>; 6–10 = +29%; 11+ = <b>+34%</b>. A <b>mediana fica em ~500 views</b> em todas as faixas; o ganho está no topo (3,7 mil → 14,4 mil views). Horários: Buffer, 7,1 mi de posts (14/09/2026), sábado é o melhor dia e domingo 9h o melhor horário. ⚠️ “O TikTok recomenda 1–4 por dia” circula em blogs e <b>não foi achado na página oficial</b>. Arquivo com marca d’água perde o Para Você.</div></div></div>
  <div class="trava y"><div class="tstripe"></div><div class="tbody"><div class="thead"><span class="tsev">Shorts</span><span class="ttitle">Volume alto apaga o ganho no longo</span></div>
  <div class="ttext">Metricool, 799 mil vídeos de 71 mil contas (29/07/2026), conferido na página do estudo em 01/10: 2–4 por semana é o ótimo <b>por Short</b>; canais com ~5 Shorts por mês têm <b>+46% de views no longo</b>; com <b>35 ou mais por mês</b>, o longo volta ao nível de quem não posta Shorts. Por isso 4/sem (~17/mês). É correlação entre contas: o Coach do vidIQ manda.</div></div></div>
  <div class="trava y"><div class="tstripe"></div><div class="tbody"><div class="thead"><span class="tsev">Shorts</span><span class="ttitle">Um Short pode “engolir” o outro</span></div>

  <div class="trava y"><div class="tstripe"></div><div class="tbody"><div class="thead"><span class="tsev">LinkedIn</span><span class="ttitle">2–4 posts por semana · link no comentário</span></div>
  <div class="ttext">van der Blom 2026 (1,3 mi de posts): alcance caiu ~60% em 2 anos; o LinkedIn passou a distribuir <b>por tema, não por seguidor</b>. PDF/carrossel tem o maior alcance (~1,39×). Link no corpo derruba alcance: <b>vai no comentário</b>.</div></div></div>
  <div class="trava y"><div class="tstripe"></div><div class="tbody"><div class="thead"><span class="tsev">Comunidade</span><span class="ttitle">2–5 posts por semana · enquete rende mais</span></div>

 secoes:[
  {h:"🧪 Os 5 testes antes de gravar",html:"<p class='gnote'>Rode estes cinco com <b>números seus</b> antes de gravar. Marque quando cada um estiver feito. O resultado real entra nos campos <b>[ ]</b> do prompter. <b>Os testes não provam que clientes voltam</b>; provam que o fluxo funciona.</p><div class='scroller'><table><thead><tr><th>Feito</th><th>Teste</th><th>Resultado esperado</th></tr></thead><tbody><tr><td><input type='checkbox' id='t9_0'></td><td><b>1.</b> Criar 3 conversas de exemplo que pararam (perguntou e sumiu)</td><td>As três entram na lista, com o que perguntaram e a hora.</td></tr><tr><td><input type='checkbox' id='t9_1'></td><td><b>2.</b> Uma conversa de mais de 48h</td><td>Ela <b>não</b> entra na lista (regra 1).</td></tr><tr><td><input type='checkbox' id='t9_2'></td><td><b>3.</b> A mensagem sai no dia seguinte, em horário comercial</td><td>Uma mensagem só, por conversa.</td></tr><tr><td><input type='checkbox' id='t9_3'></td><td><b>4.</b> O “cliente” responde “quero”</td><td>A conversa segue normal, sem mensagem repetida.</td></tr><tr><td><input type='checkbox' id='t9_4'></td><td><b>5.</b> O “cliente” responde “não”</td><td>A IA para e não chama de novo. <b>Se falhar, o trecho “a IA para” sai.</b></td></tr></tbody></table></div>"},
  {h:"⚙️ Montagem do teste (só para você, não aparece no vídeo)",html:"<ol class='glist'><li><b>Conexão:</b> o chip do WhatsApp Business ligado ao Evolution Go (instância de teste), por QR. Se o QR não aparecer: restart do <code>evo-go</code> e <code>idle_session_timeout</code> de 15 min (nota de 02/10).</li><li><b>Lista:</b> planilha com <b>nome · o que perguntou · quando · já foi chamado</b>.</li><li><b>Fluxo:</b> conversa sem pedido há mais de um dia → entra na lista; no dia seguinte, em horário comercial, uma mensagem; “não” encerra; só números seus.</li><li><b>Cliente do teste:</b> o WhatsApp normal do outro chip. <b>Nunca mande para números de clientes.</b></li><li><b>Gravação:</b> tela do celular + planilha (só WhatsApp e lista aparecem).</li></ol>"},
  {h:"📋 Textos para colar",html:"<p class='gnote'><b>Título:</b> Como vender mais pelo WhatsApp: a mensagem que traz o cliente de volta</p><p class='gnote'><b>Descrição.</b> O cliente pergunta o preço, você responde e ele some. Neste vídeo eu mostro como chamar esse cliente de volta sem ser chato e sem arriscar o seu número.<br><br>No vídeo:<br>• A mensagem que irrita (e por quê)<br>• Regra 1: só para quem já falou com você<br>• Regra 2: no dia seguinte, uma vez só<br>• Regra 3: o que escrever (lembra, pergunta, dá saída)<br>• O custo e o risco de cada caminho<br><br>De graça: mensagens-modelo [COLAR ABAIXO] · Se você quiser que eu olhe o seu caso: [LINK /v09, marcar ‘quero conversar’].<br><br><b>Mensagem-modelo:</b> “Oi! Ontem você perguntou da [produto]. Ainda quer? Se não for mais, é só me avisar que eu não te chamo de novo.”<br><br>Teste feito com números meus, com uma loja de exemplo. Valores da Meta conferidos em [DATA].</p><p class='gnote'><b>Tags:</b> como vender mais pelo whatsapp, follow up whatsapp, cliente sumiu whatsapp, mensagem para cliente whatsapp, vender pelo whatsapp, whatsapp business, ia no whatsapp, atendimento whatsapp, emerson impulso ia</p><p class='gnote'><b>Comentário fixado:</b> Quantas conversas paradas você tem hoje no seu WhatsApp? Escreve o número aqui que eu leio todos.</p><p class='gnote'><b>Cards (momentos só depois da edição):</b> card de vídeo → V08 · teaser “O preço certo na IA” · mensagem “Veja como a IA fala o preço certo” · card do canal · teaser “O que dá pra fazer no WhatsApp” · mensagem “Inscreva-se e veja o próximo”.</p>"}]

function topicosHTML(v){
  const notes=TOPICOS[v.num];
  if(!notes)return "";
  const blocs=v.blocos||[];
  const cards=notes.map((card,i)=>{
    const b=blocs[i]||{};
    const tags=[b.corte?`<span class="btag">✂ corte</span>`:"",b.take?`<span class="btag take">take separado</span>`:""].join("");
    const beats=(card.beats||[]).map(x=>{
      if(x.corte)return `<div class="mk">▌ centralizado e parado · 608px</div>`;
      const bits=[];
      if(x.lead)bits.push(`<b>${esc(x.lead)}</b>`);
      (x.fatos||[]).forEach(f=>bits.push(esc(f)));
      if(x.bili)bits.push("sai da Bilibili");
      if(x.nota)bits.push(esc(x.nota));
      const tela=x.tela?`<br><span class="pslot">Na tela: ${esc(x.tela)}</span>`:"";
      return `<p>${bits.join("<br>")}${tela}</p>`;
    }).join("");
    const crava=(card.crava||[]).length?`<div class="pend"><b>Crava.</b> ${card.crava.map(esc).join("<br>")}</div>`:"";
    const vira=card.vira?`<div><dt>Vira</dt><dd>${esc(card.vira)}</dd></div>`:"";
    return `<article class="bloco">
      <header class="bhead"><span class="btime">${esc(b.t||"")}</span><h3 class="bname">${esc(b.n||"")}</h3><span class="bfn">${esc(b.f||"")}</span>${tags}</header>
      <div class="fprompt">${beats}</div>
      <dl class="why">${crava}${vira}</dl>
    </article>`;
  }).join("");
  return `<div class="toolbar"><span>${notes.length} blocos · a linha em negrito é a ideia, o resto é o que não pode cair</span></div>${cards}`;
}

function applyPane(){
  const avail=[...document.querySelectorAll("#doc .pane")].map(p=>p.dataset.pane);
  if(!avail.length)return;
  const cur=avail.includes(pane)?pane:(avail.includes("antes")?"antes":avail[0]);
  document.querySelectorAll("#doc .pane").forEach(p=>{p.hidden=p.dataset.pane!==cur});
  document.querySelectorAll("#doc .pane-tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.pane===cur)));
}
function setPane(p){pane=p;store.set("pane",p);applyPane();
  /* rola até o início do conteúdo da aba, não até o título do vídeo */
  const bar=document.querySelector("#doc .panes"),top=document.querySelector(".top");
  if(bar)window.scrollTo({top:Math.max(0,bar.getBoundingClientRect().top+window.scrollY-(top?top.offsetHeight:0)-4)});
  else window.scrollTo({top:0})}

function render(){
  const v=VIDEOS[idx];
  const showPr=pmode&&!v.guia;
  document.body.classList.toggle("pmode",showPr);
  $("#mDoc").setAttribute("aria-pressed",String(!pmode));
  $("#mPr").setAttribute("aria-pressed",String(pmode));
  renderNav();
  $("#stamp").textContent=v.guia?(v.stamp||"Guia · consulta"):v.num+" · "+v.slug;
  $("#doc").innerHTML=docHTML(v);
  applyPane();
  restoreChecks();
  $("#prompter").innerHTML=v.guia?"":`<div class="prompter-in"><div class="ptxt" style="--psize:${psize}px">${promptHTML(v,true)}</div></div>`;
  $("#foot").innerHTML=v.guia?(v.foot||`Fonte: <code>squads/marketing/foundation/metodo-influencia-digital.md</code> + pesquisa de 01/10/2026 · aba de consulta, sem prompter`):`Fonte no repositório: <code>squads/marketing/data/roteiros/</code> · ficha de bloco + 7 camadas (template de 21/09/2026)<br>▌ marca os trechos que viram corte vertical: ali a gravação é centralizada e parada, nos 608px centrais de 1920.`;
  store.set("vid2",vkey(v));store.set("mode",pmode?"pr":"doc");
}

/* --- checklists: cada caixa marcada fica salva neste navegador --- */
function restoreChecks(){
  document.querySelectorAll('#doc input[type="checkbox"][id]').forEach(c=>{c.checked=store.get("ck:"+c.id,"0")==="1"});
  updateCounts();
}
function updateCounts(){
  document.querySelectorAll("#doc [data-count]").forEach(el=>{
    const pre=el.dataset.count;
    const boxes=[...document.querySelectorAll('#doc input[type="checkbox"][id^="'+pre+'"]')];
    const done=boxes.filter(b=>b.checked).length;
    const t=el.querySelector(".gr-count");if(t)t.innerHTML=`<b>${done}</b> de ${boxes.length} feitos`;
    const m=el.querySelector(".gr-meter i");if(m)m.style.width=(boxes.length?Math.round(done/boxes.length*100):0)+"%";
  });
  document.querySelectorAll("#doc [data-badge]").forEach(el=>{
    const pre=el.dataset.badge;
    const boxes=[...document.querySelectorAll('#doc input[type="checkbox"][id^="'+pre+'"]')];
    el.textContent=boxes.length?boxes.filter(b=>b.checked).length+"/"+boxes.length:"";
  });
}
$("#doc").addEventListener("change",e=>{
  const c=e.target;
  if(c.type==="checkbox"&&c.id){store.set("ck:"+c.id,c.checked?"1":"0");updateCounts()}
});
/* zerar pede um segundo toque, porque confirm() não abre aqui */
$("#doc").addEventListener("click",e=>{
  const pt=e.target.closest(".pane-tab");if(pt){setPane(pt.dataset.pane);return}
  const go=e.target.closest("[data-goto]");if(go){setPane(go.dataset.goto);return}
  const op=e.target.closest("[data-open]");
  if(op){const k=VIDEOS.findIndex(x=>vkey(x)===op.dataset.open);if(k>=0){idx=k;lastBy[place[idx]]=idx;stop();render();window.scrollTo({top:0})}return}
  const tp=e.target.closest("#toggleProd");
  if(tp){prodOpen=!prodOpen;store.set("prod",prodOpen?"1":"0");
    document.querySelectorAll("#doc details.prod").forEach(d=>{d.open=prodOpen});
    tp.textContent=(prodOpen?"Fechar":"Abrir")+" fichas de produção";return}
  const b=e.target.closest("[data-reset]");if(!b)return;
  if(b.dataset.armed!=="1"){
    b.dataset.armed="1";b.textContent="Toque de novo para zerar";
    clearTimeout(b._t);b._t=setTimeout(()=>{b.dataset.armed="0";b.textContent=b.dataset.label},3500);
    return;
  }
  clearTimeout(b._t);
  document.querySelectorAll('#doc input[type="checkbox"][id^="'+b.dataset.reset+'"]').forEach(c=>{c.checked=false;store.set("ck:"+c.id,"0")});
  b.dataset.armed="0";b.textContent=b.dataset.label;updateCounts();
});

$("#groups").addEventListener("click",e=>{
  const b=e.target.closest(".grp");if(!b)return;
  const g=GRUPOS.find(x=>x.id===b.dataset.g);if(!g||!g.idx.length)return;
  idx=lastBy[g.id]!=null?lastBy[g.id]:g.idx[0];
  stop();render();window.scrollTo({top:0});
});
$("#tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b)return;
  idx=+b.dataset.i;lastBy[place[idx]]=idx;stop();render();window.scrollTo({top:0});
});
$("#pvsel").addEventListener("change",e=>{idx=+e.target.value;lastBy[place[idx]]=idx;stop();render();window.scrollTo({top:0})});
$("#mDoc").addEventListener("click",()=>{pmode=false;stop();render()});
$("#mPr").addEventListener("click",()=>{pmode=true;render();window.scrollTo({top:0})});

/* --- rolagem automática --- */
let raf=null,acc=0;
function step(){
  const spd=+$("#spd").value;
  acc+=spd*0.35;
  if(acc>=1){window.scrollBy(0,Math.floor(acc));acc-=Math.floor(acc)}
  if(window.scrollY+window.innerHeight>=document.body.scrollHeight-2){stop();return}
  raf=requestAnimationFrame(step);
}
function stop(){if(raf){cancelAnimationFrame(raf);raf=null}$("#play").textContent="▶ Rolar";$("#play").classList.add("go")}
$("#play").addEventListener("click",()=>{
  if(raf){stop()}else{$("#play").textContent="❚❚ Pausar";$("#play").classList.remove("go");acc=0;raf=requestAnimationFrame(step)}
});
$("#plus").addEventListener("click",()=>{psize=Math.min(64,psize+3);store.set("psize",String(psize));render()});
$("#minus").addEventListener("click",()=>{psize=Math.max(18,psize-3);store.set("psize",String(psize));render()});
$("#topBtn").addEventListener("click",()=>{stop();window.scrollTo({top:0})});
window.addEventListener("wheel",()=>{if(raf)stop()},{passive:true});
window.addEventListener("touchstart",()=>{if(raf)stop()},{passive:true});

/* --- modo overlay: janela flutuante (teleprompter sempre por cima) --- */
/* celular: aponta para a câmera direto. A janela flutuante do Chrome existe no
   Android mas não fica por cima de outros apps, e no iOS o await antes do
   getUserMedia perde o gesto do usuário. */
const isTouch=matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>1;
const isSmall=matchMedia("(max-width:900px)").matches;
const hasPiP=("documentPictureInPicture" in window)&&!(isTouch&&isSmall);
let pip=null,pipRaf=null,pipAcc=0;

function flashMsg(t){
  const m=$("#overlayMsg");if(!m)return;
  m.textContent=t;m.classList.add("show");
  /* mensagem longa fica até o toque: 3,6s não dá pra ler instrução de permissão */
  clearTimeout(m._t);
  if(t.length<60)m._t=setTimeout(()=>m.classList.remove("show"),3600);
  else{
    m.style.pointerEvents="auto";
    m.onclick=()=>{m.classList.remove("show");m.style.pointerEvents="none"};
    m._t=setTimeout(()=>{m.classList.remove("show");m.style.pointerEvents="none"},15000);
  }
}

async function startOverlay(){
  if(pip){try{pip.close()}catch(e){}closedOverlay();return}
  if(document.getElementById("camOverlay")){closeCameraOverlay();return}
  if(hasPiP){
    try{
      pip=await documentPictureInPicture.requestWindow({width:400,height:560});
      buildOverlay(pip);
      pip.addEventListener("pagehide",closedOverlay,{once:true});
      $("#overlayBtn").textContent="⧉ Fechar overlay";
      $("#overlayBtn").classList.add("overlay-on");
      return;
    }catch(e){pip=null /* segue pro overlay de câmera, ex.: usuário cancelou */}
  }
  startCameraOverlay();
}
function closedOverlay(){
  if(pipRaf){try{pip.cancelAnimationFrame(pipRaf)}catch(e){}pipRaf=null}
  pip=null;
  $("#overlayBtn").textContent=hasPiP?"⧉ Iniciar modo overlay":"⧉ Câmera + texto";
  $("#overlayBtn").classList.remove("overlay-on");
}
function buildOverlay(win){
  const doc=win.document;
  doc.title="Prompter overlay";
  const style=doc.createElement("style");
  style.textContent=`
    html,body{margin:0;height:100%;background:#0C0C0B;color:#F3F0E9;font:15px -apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}
    #pscroll{height:calc(100% - 52px);overflow-y:auto;padding:22px 18px 40px;box-sizing:border-box;-webkit-user-select:none;user-select:none}
    #pscroll .ptxt{font-size:var(--s,26px);line-height:1.42;font-weight:500}
    #pscroll .ptxt p{margin:0 0 .6em}
    #pscroll .pblock{margin:0 0 1.3em}
    #pscroll .plabel{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#857F75;margin-bottom:.6em;display:flex;gap:8px;align-items:center;font-family:ui-monospace,monospace}
    #pscroll .plabel::after{content:"";flex:1;height:1px;background:#242220}
    #pscroll .pmark{display:flex;gap:8px;align-items:center;margin:.7em 0;padding:6px 10px;border:1px solid #E9A13B;border-radius:6px;color:#E9A13B;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-family:ui-monospace,monospace}
    #pscroll .ptake{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#E9A13B;border:1px dashed #E9A13B;border-radius:6px;padding:8px 10px;margin:0 0 1em;text-align:center;font-family:ui-monospace,monospace}
    #pscroll .pslot{color:#E9A13B;background:rgba(233,161,59,.14);border-radius:3px;padding:0 3px}
    #pbarov{position:fixed;left:0;right:0;bottom:0;height:52px;background:#0C0C0B;border-top:1px solid #242220;display:flex;align-items:center;gap:7px;padding:0 10px;box-sizing:border-box}
    #pbarov button{background:transparent;border:1px solid #242220;color:#F3F0E9;border-radius:6px;padding:6px 9px;font-size:12px;font-family:ui-monospace,monospace;cursor:pointer}
    #pbarov button.go{background:#E9A13B;border-color:#E9A13B;color:#151006}
    #pbarov input[type=range]{width:62px;accent-color:#E9A13B}
    #pbarov select{background:#1C1A17;color:#F3F0E9;border:1px solid #242220;border-radius:6px;font-family:ui-monospace,monospace;font-size:11px;padding:4px;max-width:78px}
  `;
  doc.head.appendChild(style);

  const wrap=doc.createElement("div");wrap.id="pscroll";doc.body.appendChild(wrap);
  const bar=doc.createElement("div");bar.id="pbarov";
  bar.innerHTML=`<select id="povid"></select><button class="go" id="poplay">▶</button><input type="range" id="pospd" min="1" max="10" value="${$("#spd").value}"><button id="pominus">A−</button><button id="poplus">A+</button><button id="potop">Topo</button>`;
  doc.body.appendChild(bar);

  let ovIdx=VIDEOS[idx].guia?0:idx,ovSize=psize;
  const sel=doc.getElementById("povid");
  sel.innerHTML=VIDEOS.map((v,i)=>v.guia?"":`<option value="${i}" ${i===ovIdx?"selected":""}>${vlab(v)}</option>`).join("");
  function renderOv(){
    wrap.innerHTML=`<div class="ptxt" style="--s:${ovSize}px">${promptHTML(VIDEOS[ovIdx],true)}</div>`;
    wrap.scrollTop=0;
  }
  renderOv();
  sel.addEventListener("change",()=>{ovIdx=+sel.value;pipStopLocal();renderOv()});

  function pipStep(){
    const spd=+doc.getElementById("pospd").value;
    pipAcc+=spd*0.35;
    if(pipAcc>=1){wrap.scrollTop+=Math.floor(pipAcc);pipAcc-=Math.floor(pipAcc)}
    if(wrap.scrollTop+wrap.clientHeight>=wrap.scrollHeight-2){pipStopLocal();return}
    pipRaf=win.requestAnimationFrame(pipStep);
  }
  function pipStopLocal(){
    if(pipRaf){win.cancelAnimationFrame(pipRaf);pipRaf=null}
    const b=doc.getElementById("poplay");if(b){b.textContent="▶";b.classList.add("go")}
  }
  doc.getElementById("poplay").addEventListener("click",()=>{
    const b=doc.getElementById("poplay");
    if(pipRaf){pipStopLocal()}else{b.textContent="❚❚";b.classList.remove("go");pipAcc=0;pipRaf=win.requestAnimationFrame(pipStep)}
  });
  doc.getElementById("poplus").addEventListener("click",()=>{ovSize=Math.min(64,ovSize+3);renderOv()});
  doc.getElementById("pominus").addEventListener("click",()=>{ovSize=Math.max(18,ovSize-3);renderOv()});
  doc.getElementById("potop").addEventListener("click",()=>{pipStopLocal();wrap.scrollTop=0});
  wrap.addEventListener("wheel",()=>{if(pipRaf)pipStopLocal()},{passive:true});
  wrap.addEventListener("touchstart",()=>{if(pipRaf)pipStopLocal()},{passive:true});
}

/* --- modo overlay: câmera (celular e navegadores sem janela flutuante) --- */
let camStream=null,camRaf=null,camAcc=0,camRec=null,camChunks=[],camFacing="user",camRecTimer=null;
/* mantém a tela acesa: no celular ela apagaria no meio do take */
let camLock=null;
async function keepAwake(){
  if(!("wakeLock" in navigator))return;
  try{camLock=await navigator.wakeLock.request("screen")}catch(e){camLock=null}
}
function releaseAwake(){if(camLock){try{camLock.release()}catch(e){}camLock=null}}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&document.getElementById("camOverlay")&&!camLock)keepAwake();
});

/* Traduz o erro real do navegador. Aparelho modesto falha por motivos que não
   são permissão, e mandar o usuário conferir permissão nesses casos é pista falsa. */
/* A página roda dentro de um iframe. Se o iframe pai não trouxer
   allow="camera; microphone", o Chrome recusa com NotAllowedError ANTES de
   olhar a permissão do site — por isso o cadeado diz "Permitido" e falha assim
   mesmo. Nada que eu faça aqui dentro muda isso: só abrir a página sozinha. */
const emIframe=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function permissaoDoIframe(tipo){
  try{
    if(document.featurePolicy&&document.featurePolicy.allowsFeature)
      return document.featurePolicy.allowsFeature(tipo);
  }catch(e){}
  return null; /* navegador não sabe dizer */
}

function camErroTexto(e){
  const n=e&&e.name||"";
  if(n==="NotAllowedError"||n==="SecurityError"){
    if(emIframe&&permissaoDoIframe("camera")===false)
      return "A câmera está bloqueada porque esta página está embutida em outra. Toque em ABRIR EM ABA e permita a câmera lá.";
    if(emIframe)
      return "O navegador recusou a câmera. Isso costuma ser a página estar embutida em outra — toque em ABRIR EM ABA e tente lá.";
    return "O navegador bloqueou a câmera. Toque no cadeado ao lado do endereço → Permissões → Câmera e Microfone → Permitir, e recarregue.";
  }
  if(n==="NotReadableError"||n==="AbortError")
    return "A câmera está ocupada por outro app. Feche a câmera, o WhatsApp e o Instagram pelo seletor de apps e tente de novo.";
  if(n==="NotFoundError"||n==="OverconstrainedError")
    return "Não achei essa câmera no aparelho. Tente o botão ⟲ para trocar de câmera.";
  return "Não consegui abrir a câmera ("+(n||"erro desconhecido")+"). Tente fechar e reabrir a aba.";
}

async function startCameraOverlay(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    /* getUserMedia só existe em https. Num link http o objeto some inteiro. */
    const inseguro=location.protocol!=="https:"&&location.hostname!=="localhost";
    flashMsg(inseguro
      ?"A câmera só funciona em endereço https. Abra o link começando com https://"
      :"Este navegador não permite usar a câmera. Atualize o Chrome pela Play Store.");
    return;
  }
  /* Em cascata: o ideal primeiro, e cada queda isola uma causa possível.
     Um microfone que falha não pode derrubar o vídeo junto. */
  const tentativas=[
    {video:{facingMode:camFacing},audio:true},
    {video:{facingMode:{ideal:camFacing}},audio:true},
    {video:true,audio:true},
    {video:true,audio:false}
  ];
  let stream=null,ultimoErro=null,semAudio=false;
  for(let i=0;i<tentativas.length;i++){
    try{
      stream=await navigator.mediaDevices.getUserMedia(tentativas[i]);
      semAudio=(tentativas[i].audio===false);
      break;
    }catch(e){
      ultimoErro=e;
      /* recusa explícita não melhora tentando de novo — para aqui */
      if(e&&(e.name==="NotAllowedError"||e.name==="SecurityError"))break;
    }
  }
  if(!stream){
    /* bloqueio de iframe só se resolve fora dele — revela o atalho */
    const n=ultimoErro&&ultimoErro.name;
    if(emIframe&&(n==="NotAllowedError"||n==="SecurityError")){
      const a=$("#abrirAba");
      if(a){a.href=location.href;a.hidden=false;a.classList.add("go")}
    }
    /* sem câmera o teleprompter ainda serve: tela cheia, fundo preto, letra
       grande. Gravar fica por conta da câmera do aparelho ou de outro celular. */
    camStream=null;
    buildCameraOverlay();
    keepAwake();
    flashMsg(camErroTexto(ultimoErro)+" — abri só o roteiro, em tela cheia.");
    $("#overlayBtn").textContent="⧉ Fechar overlay";
    $("#overlayBtn").classList.add("overlay-on");
    return;
  }
  camStream=stream;
  buildCameraOverlay();
  keepAwake();
  if(semAudio)flashMsg("Câmera aberta, mas sem microfone — a gravação sai muda. Serve para ler o roteiro.");
  $("#overlayBtn").textContent="⧉ Fechar overlay";
  $("#overlayBtn").classList.add("overlay-on");
}

function buildCameraOverlay(){
  const ov=document.createElement("div");
  ov.id="camOverlay";
  ov.innerHTML=`
    <video id="camVideo" autoplay muted playsinline></video>
    <div id="camText"><div class="ptxt" id="camPtxt"></div></div>
    <div id="camRecBadge" hidden>● REC <span id="camRecTime">00:00</span></div>
    <div id="camBar">
      <select id="covid" aria-label="Vídeo"></select>
      <div class="cospd-wrap"><label for="cospd">Vel</label><input type="range" id="cospd" min="1" max="10" value="${$("#spd").value}"></div>
      <button class="cgo" id="coplay" aria-label="Rolar">▶</button>
      <button id="cominus" aria-label="Diminuir fonte">A−</button>
      <button id="coplus" aria-label="Aumentar fonte">A+</button>
      <button id="coflip" aria-label="Trocar de câmera">⟲</button>
      <button id="corec">● REC</button>
      <button id="coclose" aria-label="Fechar">✕</button>
    </div>`;
  document.body.appendChild(ov);

  const video=ov.querySelector("#camVideo");
  if(camStream)video.srcObject=camStream;
  /* sem câmera, os botões que dependem dela não ficam ali enganando */
  if(!camStream){
    ov.classList.add("sem-camera");
    ov.querySelector("#coflip").hidden=true;
    ov.querySelector("#corec").hidden=true;
    ov.querySelector("#camBar").style.gridTemplateColumns="repeat(4,1fr)";
    ov.querySelector("#covid").style.gridColumn="span 1";
    ov.querySelector(".cospd-wrap").style.gridColumn="span 3";
  }

  let ovIdx=VIDEOS[idx].guia?0:idx,ovSize=psize;
  const sel=ov.querySelector("#covid");
  sel.innerHTML=VIDEOS.map((v,i)=>v.guia?"":`<option value="${i}" ${i===ovIdx?"selected":""}>${vlab(v)}</option>`).join("");
  const txt=ov.querySelector("#camPtxt");
  const scroller=ov.querySelector("#camText");
  function renderCam(){
    txt.style.fontSize=ovSize+"px";
    txt.innerHTML=promptHTML(VIDEOS[ovIdx],true);
    scroller.scrollTop=0;
  }
  renderCam();
  sel.addEventListener("change",()=>{ovIdx=+sel.value;camStopScroll();renderCam()});

  function camStep(){
    const spd=+ov.querySelector("#cospd").value;
    camAcc+=spd*0.35;
    if(camAcc>=1){scroller.scrollTop+=Math.floor(camAcc);camAcc-=Math.floor(camAcc)}
    if(scroller.scrollTop+scroller.clientHeight>=scroller.scrollHeight-2){camStopScroll();return}
    camRaf=requestAnimationFrame(camStep);
  }
  function camStopScroll(){
    if(camRaf){cancelAnimationFrame(camRaf);camRaf=null}
    const b=ov.querySelector("#coplay");if(b){b.textContent="▶";b.classList.add("cgo")}
  }
  ov.querySelector("#coplay").addEventListener("click",()=>{
    const b=ov.querySelector("#coplay");
    if(camRaf){camStopScroll()}else{b.textContent="❚❚";b.classList.remove("cgo");camAcc=0;camRaf=requestAnimationFrame(camStep)}
  });
  ov.querySelector("#coplus").addEventListener("click",()=>{ovSize=Math.min(64,ovSize+3);renderCam()});
  ov.querySelector("#cominus").addEventListener("click",()=>{ovSize=Math.max(18,ovSize-3);renderCam()});
  scroller.addEventListener("wheel",()=>{if(camRaf)camStopScroll()},{passive:true});
  /* no celular, só para se o dedo realmente arrastar — um toque solto não
     interrompe a leitura no meio de uma frase */
  let tY=null;
  scroller.addEventListener("touchstart",e=>{tY=e.touches[0].clientY},{passive:true});
  scroller.addEventListener("touchmove",e=>{
    if(tY!==null&&Math.abs(e.touches[0].clientY-tY)>12&&camRaf)camStopScroll();
  },{passive:true});
  scroller.addEventListener("touchend",()=>{tY=null},{passive:true});

  ov.querySelector("#coflip").addEventListener("click",async ()=>{
    const newFacing=camFacing==="user"?"environment":"user";
    try{
      const temAudio=camStream.getAudioTracks().length>0;
      const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:newFacing}},audio:temAudio});
      camStream.getTracks().forEach(t=>t.stop());
      camStream=ns;video.srcObject=camStream;camFacing=newFacing;
    }catch(e){flashMsg(camErroTexto(e))}
  });

  ov.querySelector("#corec").addEventListener("click",()=>{
    const b=ov.querySelector("#corec");
    const badge=ov.querySelector("#camRecBadge");
    const timeEl=ov.querySelector("#camRecTime");
    if(camRec&&camRec.state==="recording"){
      camRec.stop();
      b.textContent="● Gravar";
      badge.hidden=true;
      clearInterval(camRecTimer);
      return;
    }
    if(!camStream){flashMsg("Sem câmera aberta não há o que gravar.");return}
    if(!window.MediaRecorder){flashMsg("Gravação não é suportada neste navegador.");return}
    camChunks=[];
    const cands=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"];
    const mime=cands.find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
    try{
      camRec=mime?new MediaRecorder(camStream,{mimeType:mime}):new MediaRecorder(camStream);
    }catch(e){flashMsg("Não foi possível iniciar a gravação.");return}
    camRec.ondataavailable=e=>{if(e.data&&e.data.size)camChunks.push(e.data)};
    camRec.onstop=async ()=>{
      const blob=new Blob(camChunks,{type:camRec.mimeType||"video/webm"});
      const ext=(camRec.mimeType||"").includes("mp4")?"mp4":"webm";
      const filename=`teleprompter-${Date.now()}.${ext}`;
      try{
        if(!(window.claude&&typeof window.claude.use==="function"))throw new Error("no-claude");
        const dl=await window.claude.use("downloads");
        if(!dl)throw new Error("no-downloads");
        await dl.save({filename,data:blob});
      }catch(e){
        if(e&&e.code==="declined"){/* o usuário recusou salvar — nada a fazer */}
        else flashMsg("Não foi possível salvar o vídeo automaticamente. Tente gravar de novo.");
      }
    };
    camRec.start();
    b.textContent="⏹ Parar";
    const recStart=Date.now();badge.hidden=false;
    camRecTimer=setInterval(()=>{
      const s=Math.floor((Date.now()-recStart)/1000);
      timeEl.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    },500);
  });

  ov.querySelector("#coclose").addEventListener("click",closeCameraOverlay);
}

function closeCameraOverlay(){
  const ov=document.getElementById("camOverlay");
  if(!ov)return;
  if(camRec&&camRec.state==="recording"){try{camRec.stop()}catch(e){}}
  if(camRaf){cancelAnimationFrame(camRaf);camRaf=null}
  if(camRecTimer){clearInterval(camRecTimer);camRecTimer=null}
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
  releaseAwake();
  ov.remove();
  $("#overlayBtn").textContent=hasPiP?"⧉ Iniciar modo overlay":"⧉ Câmera + texto";
  $("#overlayBtn").classList.remove("overlay-on");
}

/* no celular o botão anuncia o que vai acontecer de fato: câmera + texto por cima */
if(!hasPiP){
  const ob=$("#overlayBtn");
  ob.textContent="⧉ Câmera + texto";
  ob.title="Abre a câmera com o roteiro por cima, com rolagem automática e gravação.";
}
$("#overlayBtn").addEventListener("click",startOverlay);

render();
})();
</script>
